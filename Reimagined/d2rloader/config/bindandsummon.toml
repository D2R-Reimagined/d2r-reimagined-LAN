# Bind And Summon
# Restart the game after changing these options.

[bindandsummon]

# Save and restore more than one Bind Demon.
bind-demon-multiple = true

# Allow classes other than Warlock (class ID 7) to save Bind Demon.
bind-demon-all-classes = true

# Save and restore Necromancer summons through the other file.
necromancer-summon-persistence = true
